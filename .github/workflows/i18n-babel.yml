name: Translations
on:
  workflow_call:
    inputs:
      command:
        description: The command(s) to extract messages and update catalogs.
        type: string
        required: true
      dependencies:
        description: Any command-line options or arguments to `pip install`, needed by the command(s).
        type: string
      source:
        description: The source language, to ignore when searching for missing translations.
        type: string
        default: en
      working-directory:
        description: The working directory from which to run the command(s).
        type: string
        default: .
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: requirements
        run: echo "package=$(echo ${{ hashFiles('MANIFEST.in') }})" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ${{ steps.requirements.outputs.package && 'pyproject.toml' || '.python-version' }}
          cache: pip
          cache-dependency-path: ${{ steps.requirements.outputs.package && 'pyproject.toml' || '**/requirements*.txt' }}
      - name: Install translate-toolkit
        run: |
          sudo apt update
          sudo apt install translate-toolkit
      - run: pip install babel ${{ inputs.dependencies }}
      - name: Update catalogs
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.command }}
      - name: Count incomplete translations
        shell: bash
        run: |
          output=$(find . -name LC_MESSAGES -not -path "*/${{ inputs.source }}/*" -exec pocount --incomplete --short "{}" +)
          echo $output
          [ "$output" = "" ]
